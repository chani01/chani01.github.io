  <path d="M 35 195 A 25 25 0 1 1 79 179" stroke="#f5a623" stroke-width="5" stroke-linecap="round" fill="none"/>
  <text x="58" y="190" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f5a623" text-anchor="middle">67</text>

  <!-- Small arc indicator 4 - bottom right -->
  <path d="M 320 195 A 25 25 0 1 1 366 195" stroke="#16213e" stroke-width="5" stroke-linecap="round" fill="none"/>
