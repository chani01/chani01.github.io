  <text x="200" y="145" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ccd6f6" text-anchor="middle">78%</text>
  <text x="200" y="168" font-family="sans-serif" font-size="12" fill="#8892b0" text-anchor="middle">Progress</text>

  <!-- Small arc indicator 1 - top left -->
  <path d="M 42 85 A 30 30 0 1 1 98 85" stroke="#16213e" stroke-width="6" stroke-linecap="round" fill="none"/>
