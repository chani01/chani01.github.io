  <path d="M 303 85 A 30 30 0 1 0 310 58" stroke="url(#arcGrad3)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <text x="331" y="78" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c792ea" text-anchor="middle">45</text>

  <!-- Small arc indicator 3 - bottom left -->
